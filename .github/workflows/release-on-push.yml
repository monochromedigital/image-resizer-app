name: Release on push

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: image-resizer-production-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Test, build, sign, and publish
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Publish next patch release
        env:
          RELEASE_REPO_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          # Optional. Without it the website falls back to its own daily check.
          SITE_REPO_TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
        run: ./Scripts/ci-release.sh
